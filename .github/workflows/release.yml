name: Release

# Push a tag like v1.1.0 (or run manually) to test, build one APK per ABI
# and publish them to a GitHub Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v1.1.0). Defaults to v<pubspec version>.'
        required: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  build-apks:
    name: Build split APKs
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve version and tag
        id: meta
        shell: bash
        run: |
          version=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          name=${version%%+*}
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="v${name}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # Optional: sign with your own key. Add these repository secrets:
      # ANDROID_KEYSTORE_BASE64 (base64 of the .jks), ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Without them the APKs are
      # signed with the debug key (installable, but not for Play Store).
      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::warning::No signing secrets configured; APKs will be debug-signed."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - run: flutter pub get

      - name: Build APKs (one per ABI)
        run: flutter build apk --release --split-per-abi --build-number ${{ github.run_number }}

      - name: Rename APKs
        id: apks
        shell: bash
        run: |
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" \
               "dist/freak-player-${{ steps.meta.outputs.tag }}-${abi}.apk"
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: apks-${{ steps.meta.outputs.tag }}
          path: dist/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: freak player ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          body: |
            ### Which APK do I install?
            - **arm64-v8a** — almost every Android phone from the last ~8 years. Pick this if unsure.
            - **armeabi-v7a** — older 32-bit phones.
            - **x86_64** — emulators and a few Chromebooks/tablets.
