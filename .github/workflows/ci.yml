name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Lets the release workflow run the full test suite before building.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  analyze-and-test:
    name: Analyze & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      # Network-dependent tests (live lyrics lookups) are excluded in CI.
      - run: flutter test --exclude-tags network

  integration-android:
    name: Integration tests (Android emulator)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Run integration tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash -c "set -o pipefail; flutter test integration_test -d emulator-5554 --reporter expanded --timeout 4m 2>&1 | tee integration.log"

      # Surface failure details as annotations on the run summary.
      - name: Report failures
        if: failure() || cancelled()
        shell: bash
        run: |
          grep -E "Expected|Actual|Which|Timed out|EXCEPTION|Exception|Bad state|\[E\]|did not complete|Playback error" integration.log             | head -40 | while IFS= read -r line; do echo "::error::${line}"; done
